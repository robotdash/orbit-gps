# Builds Orbit GPS region packs and publishes them to maps.orbitgps.ca. Runs on the 2nd of every
# month for every region in tools/regions.txt, or by hand (Actions → Build regions → Run workflow).
#
#  - roads:  ONE road network for all of Canada + US, cut into each region's routing.tar
#            (pieces of one build join up on the phone, so trips can cross regions)
#  - build:  each region's map, search, terrain and contours (4 at a time)
#  - catalog: adds everything that finished to regions-v2.json, then deletes builds older than
#             the previous one
#
# Secrets (Settings → Secrets and variables → Actions): CF_API_TOKEN (R2 edit), CF_ACCOUNT_ID.
name: Build regions

on:
  schedule:
    - cron: "17 9 2 * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Codes separated by spaces (CA-AB US-WA ...), or 'all' for tools/regions.txt"
        default: "all"
      roads:
        description: "Build the joint road network (routing) too"
        type: boolean
        default: true
      packs:
        description: "Build maps, search and Topo"
        type: boolean
        default: true
      publish:
        description: "Upload and update the catalog (untick for a test build)"
        type: boolean
        default: true

concurrency: regions   # never two runs editing the catalog at once

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.r.outputs.build }}
      graph: ${{ steps.r.outputs.graph }}
      graph_codes: ${{ steps.r.outputs.graph_codes }}
      sources: ${{ steps.s.outputs.sources }}
      graph_id: ${{ steps.s.outputs.graph_id }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          want="${{ github.event.inputs.regions || 'all' }}"
          [ "$want" = all ] && want=""
          python3 tools/regions_list.py $want > list.json
          echo "build=$(jq -c .build list.json)" >> "$GITHUB_OUTPUT"
          echo "graph=$(jq -c .graph list.json)" >> "$GITHUB_OUTPUT"
          echo "graph_codes=$(jq -r '[.graph[].code] | join(" ")' list.json)" >> "$GITHUB_OUTPUT"
          cat list.json
      - name: Check the Cloudflare key (fail now, not after hours of building)
        if: github.event.inputs.publish != 'false'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 tools/publish_region.py --check
      - id: s
        run: |
          echo "sources=$(python3 tools/latest_sources.py | paste -sd' ')" >> "$GITHUB_OUTPUT"
          # unique per build: the app joins road pieces only when this matches exactly
          echo "graph_id=na-$(date -u +%Y%m%d-%H%M)-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  roads:
    needs: plan
    if: ${{ github.event.inputs.roads != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space and use the big scratch disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet duckdb shapely pyproj pyvalhalla==3.6.3
      - name: Build the road network and cut a piece per region
        run: |
          export ${{ needs.plan.outputs.sources }}
          # (Valhalla prints thousands of harmless "admin_access" lines for boundaries outside the area)
          tools/build_graph.sh /mnt/work ${{ needs.plan.outputs.graph_id }} ${{ needs.plan.outputs.graph_codes }} 2>&1 \
            | grep -v "admin_access.admin_id"
          df -h /mnt; free -g
      - name: Keep the pieces (so a failed upload can be re-run without rebuilding)
        run: |
          mkdir -p pieces
          for c in ${{ needs.plan.outputs.graph_codes }}; do
            mkdir -p pieces/$c/out && cp /mnt/work/$c/*.json /mnt/work/$c/*.geojson pieces/$c/ && mv /mnt/work/$c/out/routing.tar pieces/$c/out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: road-pieces
          path: pieces/
          retention-days: 7
          compression-level: 0

  roads-publish:
    needs: [plan, roads]
    if: ${{ github.event.inputs.publish != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: road-pieces
          path: pieces
      - name: Upload routing pieces
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LIST: ${{ needs.plan.outputs.graph }}
        run: |
          pip install --quiet shapely
          mkdir -p entries
          for row in $(echo "$LIST" | jq -c '.[]'); do
            code=$(echo "$row" | jq -r .code); id=$(echo "$row" | jq -r .id)
            python3 tools/publish_region.py pieces/$code --id $id --kinds routing --graph ${{ needs.plan.outputs.graph_id }} --entry-only
            cp pieces/$code/entry.json entries/entry-$code-routing.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: entries-roads
          path: entries/

  build:
    needs: plan
    if: ${{ github.event.inputs.packs != 'false' && needs.plan.outputs.build != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4          # be gentle with Geofabrik and Overture
      matrix:
        region: ${{ fromJson(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet duckdb shapely pyproj numpy osmium pmtiles scipy scikit-image mapbox-vector-tile pillow
          curl -sSL https://github.com/protomaps/go-pmtiles/releases/download/v1.28.0/go-pmtiles_1.28.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin pmtiles
      - name: Build ${{ matrix.region.code }}
        run: |
          export ${{ needs.plan.outputs.sources }} OSM_SOURCE=geofabrik ROUTING=0
          tools/build_region.sh ${{ matrix.region.code }} /mnt/work
      - name: Upload files
        if: github.event.inputs.publish != 'false'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 tools/publish_region.py /mnt/work/${{ matrix.region.code }} --id ${{ matrix.region.id }} --entry-only
          mkdir -p entries && cp /mnt/work/${{ matrix.region.code }}/entry.json entries/entry-${{ matrix.region.code }}.json
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.publish != 'false'
        with:
          name: entries-${{ matrix.region.code }}
          path: entries/

  catalog:
    needs: [roads-publish, build]
    if: ${{ always() && github.event.inputs.publish != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: entries-*
          merge-multiple: true
      - name: Add the finished regions to regions-v2.json, then delete old builds
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          pip install --quiet shapely
          ls entry-*.json >/dev/null 2>&1 || { echo "no region finished"; exit 1; }
          python3 tools/publish_region.py --merge entry-*.json
